name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    name: offline tests (standard library only, no key, no MCP package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m evals.run_evals

  mcp:
    name: MCP server (pinned mcp package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_mcp_server -v
